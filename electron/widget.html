<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumi Widget</title>
<style>
:root{--violet:#9d31ff;--purple:#6f2bff;--blue:#27a7ff;--green:#42dc78;--amber:#f3c75d;--red:#ff6f7b;--text:#f4f7ff;--muted:rgba(232,238,255,.58);--line:rgba(156,85,255,.24);--panel:rgba(8,12,24,.96)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",Inter,system-ui,sans-serif;color:var(--text);-webkit-user-select:none}button{font:inherit;color:inherit}.widget{position:absolute;inset:2px;border:1px solid var(--line);border-radius:31px;background:linear-gradient(145deg,rgba(9,12,24,.98),rgba(5,9,18,.98));box-shadow:0 14px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.035);overflow:hidden;-webkit-app-region:drag}.widget.expanded{border-radius:17px}.compact{height:62px;display:flex;align-items:center;gap:4px;padding:4px 6px}.logo-button{width:40px;height:54px;border:0;background:transparent;padding:0;display:grid;place-items:center;flex:none;cursor:pointer;-webkit-app-region:no-drag}.logo-button img{max-width:38px;max-height:52px;width:auto;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 4px 10px rgba(113,55,255,.42))}.summary{min-width:0;flex:1;height:46px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;-webkit-app-region:no-drag}.filename-viewport{width:100%;overflow:hidden;white-space:nowrap}.filename-track{display:flex;width:max-content;gap:18px;will-change:transform}.filename-track span{display:block;font-size:10.5px;font-weight:720;line-height:16px;white-space:nowrap}.filename-viewport.scrolling .filename-track{animation:filename-loop var(--marquee-duration,11s) linear 1.5s infinite}@keyframes filename-loop{0%,20%{transform:translateX(0)}80%,100%{transform:translateX(calc(-50% - 9px))}}.filename-viewport:not(.scrolling) .filename-track span[aria-hidden="true"]{display:none}.meta-line{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:3px;font-size:9px;color:var(--muted);white-space:nowrap}.speed{overflow:hidden;text-overflow:ellipsis}.percentage{flex:none;color:#bf5cff;font-size:10px;font-weight:760;min-width:27px;text-align:right}.compact-actions{display:flex;align-items:center;gap:2px;flex:none;-webkit-app-region:no-drag}.cycle{width:27px;height:26px;border:1px solid rgba(167,92,255,.24);border-radius:10px;background:linear-gradient(145deg,rgba(31,25,54,.82),rgba(10,14,29,.9));padding:0 4px;display:flex;align-items:center;justify-content:center;gap:3px;color:#eef3ff;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 12px rgba(0,0,0,.22)}.cycle:hover{border-color:rgba(181,106,255,.48);background:linear-gradient(145deg,rgba(48,31,79,.9),rgba(12,17,34,.94))}.cycle-current{font-size:9px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(180,84,255,.46)}.cycle-divider{width:1px;height:11px;border-radius:2px;background:linear-gradient(180deg,rgba(196,91,255,.2),rgba(95,151,255,.9),rgba(196,91,255,.2));box-shadow:0 0 6px rgba(109,133,255,.45)}.cycle-total{font-size:8px;font-weight:650;line-height:1;color:#8f9bb2;font-variant-numeric:tabular-nums}.ring-button,.row-ring{position:relative;border-radius:50%;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer}.ring-button{width:37px;height:37px}.ring-button svg,.row-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}.ring-track{fill:none;stroke:rgba(125,134,169,.22);stroke-width:3}.ring-fill{fill:none;stroke:url(#compact-gradient);stroke-width:3;stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25;transition:stroke-dashoffset .35s,stroke .2s}.ring-icon{position:relative;z-index:1;font-size:11px;line-height:1;color:#fff}.ring-button .ring-icon{width:20px;height:20px;display:grid;place-items:center;transform:translateY(-1.5px);filter:drop-shadow(0 2px 5px rgba(0,0,0,.48))}.transport-pause{width:16px;height:17px;display:flex;align-items:center;justify-content:center;gap:4px}.transport-pause::before,.transport-pause::after{content:"";display:block;width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,#fff,#dce5ff);box-shadow:0 0 5px rgba(255,255,255,.25)}.transport-play{width:0;height:0;margin-left:2px;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid #f7f9ff;filter:drop-shadow(0 0 4px rgba(255,255,255,.22))}.transport-check{width:15px;height:9px;border-left:4px solid var(--green);border-bottom:4px solid var(--green);border-radius:2px;transform:rotate(-45deg) translate(1px,-1px);filter:drop-shadow(0 0 5px rgba(66,220,120,.38))}.transport-idle{width:5px;height:5px;border-radius:50%;background:#9ca8c1;box-shadow:0 0 7px rgba(156,168,193,.45)}.transport-error{font-size:15px;font-weight:900;color:#ff9ba5}.expand{position:relative;width:17px;height:30px;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:start center;transform:translateY(-14px);overflow:visible}.expand::before{content:"";position:absolute;top:4px;left:50%;width:22px;height:20px;transform:translateX(-50%);border:1px solid rgba(173,92,255,.34);border-radius:9px;background:linear-gradient(145deg,rgba(39,28,64,.92),rgba(9,14,29,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 4px 11px rgba(0,0,0,.3);transition:border-color .18s,background .18s,box-shadow .18s}.expand:hover::before{border-color:rgba(194,119,255,.66);background:linear-gradient(145deg,rgba(57,35,91,.97),rgba(12,18,36,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 0 11px rgba(139,68,255,.26)}.chevron{position:relative;z-index:1;width:10px;height:10px;margin-top:8px;border-left:2.7px solid #f6f8ff;border-top:2.7px solid #f6f8ff;border-radius:1px;transform:rotate(45deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.52));transition:transform .18s}.widget.expanded .chevron{transform:rotate(225deg)}.expanded-panel{display:none;height:calc(100% - 62px);border-top:1px solid rgba(255,255,255,.06);padding:7px 8px 6px;-webkit-app-region:no-drag}.widget.expanded .expanded-panel{display:flex;flex-direction:column}.widget.expanded .summary .filename-track span{font-size:11px}.widget.expanded .cycle,.widget.expanded .percentage,.widget.expanded .ring-button{display:none}.panel-toolbar{display:flex;align-items:center;gap:5px;margin-bottom:6px}.tabs{display:flex;min-width:0;flex:1;border:1px solid rgba(255,255,255,.07);border-radius:9px;overflow:hidden;background:rgba(255,255,255,.02)}.tab{min-width:0;flex:1;border:0;border-right:1px solid rgba(255,255,255,.06);background:transparent;padding:5px 4px;font-size:8px;color:#aeb8cc;cursor:pointer;white-space:nowrap}.tab:last-child{border-right:0}.tab.active{background:linear-gradient(135deg,rgba(132,39,255,.72),rgba(73,35,163,.6));color:#fff}.tab b{margin-left:3px;font-size:7px;padding:1px 4px;border-radius:99px;background:rgba(255,255,255,.11)}.tool{width:25px;height:25px;border:1px solid rgba(255,255,255,.09);border-radius:8px;background:rgba(255,255,255,.025);display:grid;place-items:center;padding:0;cursor:pointer;font-size:11px}.task-list{min-height:0;flex:1;overflow:auto;scrollbar-width:none}.task-list::-webkit-scrollbar{display:none}.task-row{display:grid;grid-template-columns:26px minmax(0,1fr) 29px 32px 15px;align-items:center;gap:5px;min-height:45px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.06)}.task-row:last-child{border-bottom:0}.file-icon{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(129,52,255,.45),rgba(33,120,255,.28));border:1px solid rgba(138,102,255,.24);font-size:12px}.task-copy{min-width:0}.task-name{font-size:9.2px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{font-size:7.4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.task-pct{font-size:8.5px;font-weight:760;color:#ba52ff;text-align:right}.row-ring{width:31px;height:31px}.row-ring .ring-track,.row-ring .ring-fill{stroke-width:2.7}.row-ring .ring-icon{font-size:9px}.row-ring.completed .ring-fill{stroke:var(--green)}.row-ring.completed .ring-icon{color:var(--green);font-size:12px}.row-more{width:15px;height:27px;border:0;background:transparent;padding:0;font-size:14px;color:#c6cede;cursor:pointer}.queued-actions{display:flex;gap:3px;justify-content:flex-end;grid-column:3/5}.queued-actions button,.open-btn{height:25px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.035);padding:0 7px;font-size:8px;cursor:pointer}.queued-actions .cancel{width:25px;padding:0;color:#ff9aa2}.open-btn{grid-column:3/5}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#68758d;font-size:9px;line-height:1.5}.panel-footer{height:25px;display:flex;align-items:center;gap:6px;border-top:1px solid rgba(255,255,255,.06);padding-top:5px;font-size:7.5px;color:#8c98ae}.footer-counts{white-space:nowrap}.footer-folder{min-width:0;margin-left:auto;display:flex;align-items:center;gap:4px}.folder-path{max-width:137px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bf57ff}.footer-folder button{width:23px;height:20px;border:1px solid rgba(255,255,255,.09);border-radius:6px;background:rgba(255,255,255,.03);padding:0;cursor:pointer}.offline .filename-track span{color:#ff8f99}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="compact">
    <button class="logo-button" id="logo-button" title="Lumi downloads"><img src="../Resouces/download%20manager%20logo.png" alt="Lumi Download Manager"></button>
    <div class="summary" id="summary" title="Show downloads">
      <div class="filename-viewport" id="filename-viewport"><div class="filename-track" id="filename-track"><span id="filename-a">Connecting…</span><span id="filename-b" aria-hidden="true">Connecting…</span></div></div>
      <div class="meta-line"><span class="speed" id="speed">Starting Lumi…</span><span class="percentage" id="percentage"></span></div>
    </div>
    <div class="compact-actions">
      <button class="cycle" id="cycle-button" title="Next active download" hidden><span class="cycle-current" id="cycle-current">1</span><span class="cycle-divider" aria-hidden="true"></span><span class="cycle-total" id="cycle-total">1</span></button>
      <button class="ring-button" id="ring-button" title="Pause or resume">
        <svg viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="compact-gradient" x1="0" x2="1"><stop offset="0" stop-color="#a633ff"></stop><stop offset="1" stop-color="#258cff"></stop></linearGradient></defs><circle class="ring-track" cx="17" cy="17" r="15"></circle><circle class="ring-fill" id="ring" cx="17" cy="17" r="15"></circle></svg>
        <span class="ring-icon" id="ring-icon"><span class="transport-idle" aria-hidden="true"></span></span>
      </button>
      <button class="expand" id="expand-button" title="Expand downloads"><span class="chevron"></span></button>
    </div>
  </div>
  <section class="expanded-panel">
    <div class="panel-toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="downloading">Downloading <b id="count-downloading">0</b></button>
        <button class="tab" data-tab="downloaded">Downloaded <b id="count-downloaded">0</b></button>
        <button class="tab" data-tab="queued">Queued <b id="count-queued">0</b></button>
      </div>
      <button class="tool" id="open-folder" title="Open selected file location">▢</button>
      <button class="tool" id="open-main" title="Open Lumi DM">⚙</button>
    </div>
    <div class="task-list" id="task-list"></div>
    <div class="panel-footer"><span class="footer-counts" id="footer-counts">0 active · 0 downloaded · 0 queued</span><span class="footer-folder"><span>Folder:</span><span class="folder-path" id="folder-path">Downloads</span><button id="footer-open" title="Open file location">▢</button></span></div>
  </section>
</div>
<script>
const CIRC=94.25;
const RUNNING=new Set(['running','resolving','pausing','post_processing']);
let expanded=false;
let activeTab='downloading';
let selectedIndex=0;
let snapshot={downloads:[],net:{},settings:{},capacity:{}};
let lastStatuses=new Map();
let knownTaskIds=new Set();
let sessionTaskIds=new Set();
let initialised=false;
let completedTask=null;
let completionUntil=0;
const $=id=>document.getElementById(id);
function fmtRate(value){const b=Number(value||0);if(b>=1048576)return`${(b/1048576).toFixed(2)} MB/s`;if(b>=1024)return`${(b/1024).toFixed(1)} KB/s`;return`${Math.round(b)} B/s`}
function fmtMbpsFromBytes(value){const bits=Number(value||0)*8;if(bits>=1e6)return`${(bits/1e6).toFixed(1)} Mbps`;if(bits>=1e3)return`${(bits/1e3).toFixed(0)} Kbps`;return`${Math.round(bits)} bps`}
function fmtMbps(value){const n=Number(value||0);return n>=100?`${n.toFixed(0)} Mbps`:`${n.toFixed(1)} Mbps`}
function fmtBytes(value){const b=Number(value||0);if(b>=1073741824)return`${(b/1073741824).toFixed(1)} GB`;if(b>=1048576)return`${(b/1048576).toFixed(1)} MB`;if(b>=1024)return`${(b/1024).toFixed(0)} KB`;return`${Math.round(b)} B`}
function progress(task){return task?.total_bytes?Math.max(0,Math.min(100,Number(task.downloaded_bytes||0)*100/Number(task.total_bytes))):Math.max(0,Math.min(100,Number(task?.progress_percent||0)))}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function taskName(task){return task?.filename||task?.metadata?.title||task?.url||task?.id||'Lumi download'}
function syncSessionTasks(){const newCompleted=[];for(const task of snapshot.downloads){const id=String(task.id);const previous=lastStatuses.get(id);if(!initialised){knownTaskIds.add(id);lastStatuses.set(id,task.status);if(RUNNING.has(task.status)||task.status==='paused')sessionTaskIds.add(id);continue}if(!knownTaskIds.has(id)||(RUNNING.has(task.status)&&!RUNNING.has(previous)))sessionTaskIds.add(id);if(task.status==='completed'&&previous&&previous!=='completed'&&(RUNNING.has(previous)||previous==='paused'||previous==='queued'))newCompleted.push(task);knownTaskIds.add(id);lastStatuses.set(id,task.status)}initialised=true;return newCompleted}
function downloadingTasks(){return snapshot.downloads.filter(task=>(RUNNING.has(task.status)||task.status==='paused')&&(sessionTaskIds.has(String(task.id))||RUNNING.has(task.status)))}
function downloadedTasks(){return snapshot.downloads.filter(task=>task.status==='completed')}
function queuedTasks(){return snapshot.downloads.filter(task=>task.status==='queued')}
function compactPool(){return downloadingTasks()}
function selectedTask(){const pool=compactPool();if(!pool.length)return null;selectedIndex=((selectedIndex%pool.length)+pool.length)%pool.length;return pool[selectedIndex]}
function capacityLine(){const value=snapshot.capacity?.result;if(!value)return snapshot.capacity?.state==='running'?'Testing capacity…':'Capacity not tested';return`Capacity ↓ ${fmtMbps(value.download_mbps)} · ↑ ${fmtMbps(value.upload_mbps)}`}
function setMarquee(text){const value=String(text||'');if($('filename-track').dataset.value===value)return;$('filename-track').dataset.value=value;$('filename-a').textContent=value;$('filename-b').textContent=value;requestAnimationFrame(()=>{const viewport=$('filename-viewport');const needs=$('filename-a').scrollWidth>viewport.clientWidth;viewport.classList.toggle('scrolling',needs);const seconds=Math.max(8,Math.min(20,value.length*.32));viewport.style.setProperty('--marquee-duration',`${seconds}s`)})}
function setTransportIcon(icon){const markup={pause:'<span class="transport-pause" aria-hidden="true"></span>',play:'<span class="transport-play" aria-hidden="true"></span>',check:'<span class="transport-check" aria-hidden="true"></span>',idle:'<span class="transport-idle" aria-hidden="true"></span>',error:'<span class="transport-error" aria-hidden="true">!</span>'};$('ring-icon').innerHTML=markup[icon]||markup.idle}
function setRing(pct,color,icon){const ratio=Math.max(0,Math.min(1,Number(pct||0)));$('ring').style.strokeDashoffset=CIRC*(1-ratio);$('ring').style.stroke=color||'';setTransportIcon(icon)}
function ringHtml(task){const pct=progress(task);const paused=task.status==='paused';const complete=task.status==='completed';const color=complete?'#42dc78':paused?'#f3c75d':'url(#row-gradient)';const icon=complete?'✓':paused?'▶':'Ⅱ';return`<button class="row-ring${complete?' completed':''}" data-action="${complete?'open':paused?'resume':'pause'}" data-id="${escapeHtml(task.id)}" title="${complete?'Open file location':paused?'Resume':'Pause'}"><svg viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="row-gradient" x1="0" x2="1"><stop offset="0" stop-color="#a633ff"></stop><stop offset="1" stop-color="#258cff"></stop></linearGradient></defs><circle class="ring-track" cx="17" cy="17" r="15"></circle><circle class="ring-fill" cx="17" cy="17" r="15" style="stroke:${color};stroke-dashoffset:${CIRC*(1-(complete?1:pct/100))}"></circle></svg><span class="ring-icon">${icon}</span></button>`}
function fileGlyph(task){const name=taskName(task).toLowerCase();if(name.includes('windows')||name.endsWith('.iso'))return'⊞';if(name.includes('ubuntu')||name.includes('linux'))return'◆';if(/\.(zip|rar|7z|tar|gz)$/.test(name))return'▣';if(/\.(exe|msi|dmg|pkg|apk)$/.test(name))return'◇';return'↓'}
function renderCompact(){const active=compactPool();const task=selectedTask();$('cycle-button').hidden=active.length<2;$('cycle-current').textContent=String(active.length>1?selectedIndex+1:1);$('cycle-total').textContent=String(Math.max(active.length,1));const now=Date.now();if(expanded){setMarquee('Lumi downloads');$('speed').textContent=`${active.length} active · ${downloadedTasks().length} downloaded · ${queuedTasks().length} queued`;$('percentage').textContent='';setRing(0,'rgba(255,255,255,.12)','idle');return}if(!snapshot.online){setMarquee('Lumi server recovering');$('speed').textContent='Reconnecting automatically';$('percentage').textContent='';setRing(0,'rgba(255,255,255,.12)','error');return}if(task){const pct=Math.round(progress(task));setMarquee(taskName(task));$('speed').textContent=task.status==='paused'?'Paused':fmtRate(task.speed_bytes_per_sec||0);$('percentage').textContent=`${pct}%`;setRing(pct/100,task.status==='paused'?'#f3c75d':'url(#compact-gradient)',task.status==='paused'?'play':'pause');return}if(now<completionUntil&&completedTask){setMarquee(taskName(completedTask));$('speed').textContent='Completed';$('percentage').textContent='';setRing(1,'#42dc78','check');return}const liveRx=Number(snapshot.net?.rx_bps||0);setMarquee(`Live ↓ ${fmtMbpsFromBytes(liveRx)}`);$('speed').textContent=capacityLine();$('percentage').textContent='';setRing(0,'rgba(255,255,255,.18)','idle')}
function renderTabs(){const groups={downloading:downloadingTasks(),downloaded:downloadedTasks(),queued:queuedTasks()};$('count-downloading').textContent=groups.downloading.length;$('count-downloaded').textContent=groups.downloaded.length;$('count-queued').textContent=groups.queued.length;document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===activeTab));return groups}
function renderTaskRow(task,tab){const pct=Math.round(progress(task));const name=escapeHtml(taskName(task));if(tab==='downloaded')return`<article class="task-row"><div class="file-icon">${fileGlyph(task)}</div><div class="task-copy"><div class="task-name" title="${name}">${name}</div><div class="task-meta">${fmtBytes(task.total_bytes||task.downloaded_bytes||0)} · Completed</div></div><span class="task-pct"></span>${ringHtml(task)}<button class="row-more" data-action="open" data-id="${escapeHtml(task.id)}" title="Open location">⋮</button></article>`;if(tab==='queued')return`<article class="task-row"><div class="file-icon">${fileGlyph(task)}</div><div class="task-copy"><div class="task-name" title="${name}">${name}</div><div class="task-meta">${fmtBytes(task.total_bytes||0)} · Queued</div></div><div class="queued-actions"><button data-action="resume" data-id="${escapeHtml(task.id)}" title="Start">▶</button><button class="cancel" data-action="cancel" data-id="${escapeHtml(task.id)}" title="Cancel">×</button></div><button class="row-more" data-action="main" title="More">⋮</button></article>`;return`<article class="task-row"><div class="file-icon">${fileGlyph(task)}</div><div class="task-copy"><div class="task-name" title="${name}">${name}</div><div class="task-meta">${task.status==='paused'?'Paused':fmtRate(task.speed_bytes_per_sec||0)} · ${fmtBytes(task.downloaded_bytes||0)} / ${fmtBytes(task.total_bytes||0)}</div></div><span class="task-pct">${pct}%</span>${ringHtml(task)}<button class="row-more" data-action="cancel" data-id="${escapeHtml(task.id)}" title="Cancel">⋮</button></article>`}
function renderExpanded(){const groups=renderTabs();const tasks=groups[activeTab]||[];$('task-list').innerHTML=tasks.length?tasks.slice(0,20).map(task=>renderTaskRow(task,activeTab)).join(''):`<div class="empty">No ${activeTab} downloads.</div>`;const active=groups.downloading.length,done=groups.downloaded.length,queued=groups.queued.length;$('footer-counts').textContent=`${active} active · ${done} downloaded · ${queued} queued`;const focus=selectedTask()||groups.downloaded[0]||groups.queued[0];$('folder-path').textContent=focus?.target_dir||focus?.path||'Downloads';$('open-folder').dataset.id=focus?.id||'';$('footer-open').dataset.id=focus?.id||''}
function render(){const completed=syncSessionTasks();if(completed.length){completedTask=completed[0];completionUntil=Date.now()+5000}const widget=$('widget');widget.classList.toggle('expanded',expanded);widget.classList.toggle('offline',!snapshot.online);renderCompact();renderExpanded()}
async function refresh(){snapshot=await window.lumiWidget.snapshot();expanded=Boolean(snapshot.expanded);render()}
async function toggle(){expanded=await window.lumiWidget.toggleExpanded();render()}
async function runAction(action,id=''){if(!action)return;if(action==='main')return window.lumiWidget.action('main');await window.lumiWidget.action(action,id);await refresh()}
$('summary').onclick=toggle;$('logo-button').onclick=toggle;$('expand-button').onclick=toggle;$('cycle-button').onclick=event=>{event.stopPropagation();const pool=compactPool();if(pool.length>1){selectedIndex=(selectedIndex+1)%pool.length;renderCompact()}};$('ring-button').onclick=async()=>{if(Date.now()<completionUntil&&completedTask&&!selectedTask())return runAction('open',completedTask.id);const task=selectedTask();if(!task)return toggle();return runAction(task.status==='paused'?'resume':'pause',task.id)};$('tabs').onclick=event=>{const button=event.target.closest('[data-tab]');if(!button)return;activeTab=button.dataset.tab;renderExpanded()};$('task-list').onclick=event=>{const button=event.target.closest('[data-action]');if(!button)return;runAction(button.dataset.action,button.dataset.id||'')};$('open-main').onclick=()=>runAction('main');$('open-folder').onclick=()=>{const id=$('open-folder').dataset.id;if(id)runAction('open',id)};$('footer-open').onclick=()=>{const id=$('footer-open').dataset.id;if(id)runAction('open',id)};window.lumiWidget.onExpanded(value=>{expanded=Boolean(value);render()});window.lumiWidget.onSettings(()=>refresh());window.lumiWidget.onCapacity(value=>{snapshot.capacity=value;render()});refresh();setInterval(refresh,1300);
</script>
