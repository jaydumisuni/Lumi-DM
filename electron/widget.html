<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumi Widget</title>
<style>
:root{--violet:#9b2cff;--purple:#7047ff;--blue:#1db7ff;--green:#45d86f;--amber:#f4c04e;--danger:#ff7180}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:#f4f6ff;-webkit-user-select:none}
button{font:inherit;color:inherit}
.widget{position:absolute;inset:2px;border:1px solid rgba(155,44,255,.42);border-radius:31px;background:linear-gradient(135deg,rgba(9,11,23,.97),rgba(10,13,26,.96));box-shadow:0 14px 34px rgba(0,0,0,.38),inset 0 0 24px rgba(68,63,160,.06);overflow:hidden;-webkit-app-region:drag}
.widget.expanded{border-radius:18px}
.compact{height:62px;display:flex;align-items:center;gap:6px;padding:6px 8px}
.logo-button{width:43px;height:50px;border:0;background:transparent;padding:0;display:block;position:relative;overflow:hidden;flex:none;cursor:pointer;-webkit-app-region:no-drag}
.logo-button img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;filter:drop-shadow(0 4px 12px rgba(99,61,255,.35))}.expanded-logo img{width:100%;height:100%;object-fit:contain;display:block}
.summary{min-width:0;flex:1;-webkit-app-region:no-drag}
.filename-window{height:18px;overflow:hidden;white-space:nowrap;position:relative}
.filename{display:inline-block;font-size:10.5px;font-weight:700;line-height:18px;white-space:nowrap;color:#f5f7ff}
.filename.marquee{animation:filename-loop 8s ease-in-out 1.2s infinite}
@keyframes filename-loop{0%,14%{transform:translateX(0)}86%,100%{transform:translateX(var(--travel,0px))}}
.meta{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:2px;font-size:9px;color:#aeb9d2;white-space:nowrap}
.speed{color:#66b9ff;font-weight:700}.percent{color:#b865ff;font-weight:750}
.compact-actions{display:flex;align-items:center;gap:3px;flex:none;-webkit-app-region:no-drag}
.cycle{width:18px;height:24px;border:1px solid rgba(255,255,255,.10);border-radius:8px;background:rgba(255,255,255,.035);font-size:10px;cursor:pointer;display:none}
.cycle.visible{display:grid;place-items:center}
.circle{width:35px;height:35px;border-radius:50%;border:0;background:rgba(255,255,255,.025);display:grid;place-items:center;cursor:pointer;position:relative}
.circle svg{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
.ring-track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:2.8}
.ring-fill{fill:none;stroke:url(#compactGradient);stroke-width:2.8;stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25;transition:stroke-dashoffset .35s,stroke .2s}
.circle span{font-size:10px;position:relative;z-index:1}
.expand{width:23px;height:23px;border:1px solid rgba(255,255,255,.08);border-radius:50%;background:rgba(255,255,255,.025);font-size:14px;cursor:pointer}
.expanded-panel{display:none;height:calc(100% - 62px);border-top:1px solid rgba(255,255,255,.07);padding:8px 9px 8px;-webkit-app-region:no-drag}
.widget.expanded .expanded-panel{display:flex;flex-direction:column}
.expanded-head{display:flex;align-items:center;gap:7px;height:41px}
.expanded-logo{width:36px;height:36px;flex:none}
.expanded-name{font-size:11px;font-weight:800;letter-spacing:.01em;min-width:0;flex:1}
.head-actions{display:flex;gap:4px}
.head-btn{width:27px;height:27px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.035);cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(0,0,0,.13);margin:0 0 7px}
.tab{border:0;border-radius:7px;background:transparent;padding:6px 2px;font-size:9px;color:#aeb6ca;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,rgba(125,35,255,.78),rgba(73,36,181,.66));color:#fff}
.count{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:999px;background:rgba(255,255,255,.10);font-size:8px;margin-left:3px}
.task-list{display:grid;gap:2px;overflow:auto;flex:1;scrollbar-width:none}
.task-list::-webkit-scrollbar{display:none}
.task{min-height:48px;display:grid;grid-template-columns:32px minmax(0,1fr) auto 35px 18px;align-items:center;gap:6px;border-bottom:1px solid rgba(255,255,255,.065);padding:4px 1px}
.task:last-child{border-bottom:0}
.file-badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(89,132,255,.20),rgba(122,41,255,.16));font-size:15px}
.task-copy{min-width:0}.task-name{font-size:9.5px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{font-size:8px;color:#8491ab;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-percent{font-size:9px;color:#b767ff;font-weight:750;text-align:right;min-width:29px}
.task-ring{--p:0;--ring:var(--purple);width:34px;height:34px;border:0;border-radius:50%;padding:3px;background:conic-gradient(var(--ring) calc(var(--p)*1%),rgba(255,255,255,.09) 0);cursor:pointer;display:grid;place-items:center}
.task-ring:before{content:"";grid-area:1/1;width:27px;height:27px;border-radius:50%;background:#0b0e1c;border:1px solid rgba(255,255,255,.045)}
.task-ring span{grid-area:1/1;position:relative;font-size:10px}
.more{width:18px;height:25px;border:0;background:transparent;color:#a8b0c4;cursor:pointer;font-size:14px}
.empty{display:grid;place-items:center;text-align:center;height:100%;font-size:9px;color:#68758e;line-height:1.55;padding:12px}
.panel-footer{display:flex;align-items:center;justify-content:space-between;gap:7px;border-top:1px solid rgba(255,255,255,.07);padding-top:7px;margin-top:4px}
.footer-summary{font-size:8px;color:#8692aa;white-space:nowrap}.footer-summary b{color:#bd6bff}
.footer-btn{border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.04);padding:6px 8px;font-size:8px;cursor:pointer}
.offline .filename{color:#ff939c}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="compact">
    <button class="logo-button" id="logo-button" title="Lumi controls">
      <img src="../Resouces/download%20manager%20logo.png" onerror="this.src='http://127.0.0.1:7000/static/favicon-96.png'" alt="Lumi Download Manager">
    </button>
    <div class="summary" id="summary" title="Show downloads">
      <div class="filename-window" id="filename-window"><span class="filename" id="filename">Connecting…</span></div>
      <div class="meta"><span class="speed" id="compact-speed">0 B/s</span><span class="percent" id="compact-percent"></span></div>
    </div>
    <div class="compact-actions">
      <button class="cycle" id="cycle-button" title="Next download">›</button>
      <button class="circle" id="ring-button" title="Pause, resume, or open location">
        <svg viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="compactGradient"><stop offset="0%" stop-color="#9b2cff"/><stop offset="100%" stop-color="#1db7ff"/></linearGradient></defs><circle class="ring-track" cx="17" cy="17" r="15"></circle><circle class="ring-fill" id="ring" cx="17" cy="17" r="15"></circle></svg>
        <span id="ring-icon">•</span>
      </button>
      <button class="expand" id="expand-button" title="Expand widget"><span id="expand-icon">⌃</span></button>
    </div>
  </div>
  <section class="expanded-panel">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="downloading">Downloading <span class="count" id="count-downloading">0</span></button>
      <button class="tab" data-tab="downloaded">Downloaded <span class="count" id="count-downloaded">0</span></button>
      <button class="tab" data-tab="queued">Queued <span class="count" id="count-queued">0</span></button>
    </div>
    <div class="task-list" id="task-list"></div>
    <div class="panel-footer"><span class="footer-summary" id="footer-summary"></span><button class="footer-btn" id="footer-main">Open Lumi</button></div>
  </section>
</div>
<script>
const CIRC=94.25;
let expanded=false;
let selectedTab="downloading";
let compactIndex=0;
let compactTask=null;
let snapshot={downloads:[],net:{},settings:{},capacity:{}};
let lastStatuses=new Map();
let knownTaskIds=new Set();
let sessionTaskIds=new Set();
let initialised=false;
let completionUntil=0;

const $=id=>document.getElementById(id);
const ACTIVE=new Set(["running","resolving","pausing","post_processing"]);
const PAUSED=new Set(["paused"]);
const QUEUED=new Set(["queued","staged","needs_link"]);
const COMPLETE=new Set(["completed"]);

function fmtRate(value){const b=Number(value||0);if(b>=1048576)return`${(b/1048576).toFixed(2)} MB/s`;if(b>=1024)return`${(b/1024).toFixed(1)} KB/s`;return`${Math.round(b)} B/s`}
function fmtMbpsFromBytes(value){const bits=Number(value||0)*8;if(bits>=1e6)return`${(bits/1e6).toFixed(1)} Mbps`;if(bits>=1e3)return`${(bits/1e3).toFixed(0)} Kbps`;return`${Math.round(bits)} bps`}
function fmtMbps(value){const number=Number(value||0);return number>=100?`${number.toFixed(0)} Mbps`:`${number.toFixed(1)} Mbps`}
function fmtBytes(value){const b=Number(value||0);if(b>=1073741824)return`${(b/1073741824).toFixed(1)} GB`;if(b>=1048576)return`${(b/1048576).toFixed(1)} MB`;if(b>=1024)return`${(b/1024).toFixed(0)} KB`;return`${Math.round(b)} B`}
function progress(task){return task?.total_bytes?Math.max(0,Math.min(100,Number(task.downloaded_bytes||0)*100/Number(task.total_bytes))):Math.max(0,Math.min(100,Number(task?.progress_percent||0)))}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function taskName(task){return task?.filename||task?.metadata?.title||task?.url||"Lumi download"}
function capacityLine(){const value=snapshot.capacity?.result;if(!value)return snapshot.capacity?.state==="running"?"Testing capacity…":"Capacity not tested";return`Capacity ↓ ${fmtMbps(value.download_mbps)} · ↑ ${fmtMbps(value.upload_mbps)}`}
function updateSessionTasks(){
  if(!initialised){
    for(const task of snapshot.downloads){knownTaskIds.add(task.id);lastStatuses.set(task.id,task.status);if(ACTIVE.has(task.status)||PAUSED.has(task.status))sessionTaskIds.add(task.id)}
    initialised=true;return;
  }
  for(const task of snapshot.downloads){
    const previous=lastStatuses.get(task.id);
    if(!knownTaskIds.has(task.id)||(ACTIVE.has(task.status)&&!ACTIVE.has(previous)))sessionTaskIds.add(task.id);
    knownTaskIds.add(task.id);lastStatuses.set(task.id,task.status);
  }
}
function downloadingTasks(){return snapshot.downloads.filter(task=>(ACTIVE.has(task.status)||PAUSED.has(task.status))&&(ACTIVE.has(task.status)||sessionTaskIds.has(task.id)))}
function downloadedTasks(){return snapshot.downloads.filter(task=>COMPLETE.has(task.status)).slice(0,40)}
function queuedTasks(){return snapshot.downloads.filter(task=>QUEUED.has(task.status))}
function tabTasks(tab){if(tab==="downloaded")return downloadedTasks();if(tab==="queued")return queuedTasks();return downloadingTasks()}
function setRing(pct,color,icon){
  $("ring").style.strokeDashoffset=CIRC*(1-Math.max(0,Math.min(1,pct)));
  $("ring").style.stroke=color;
  $("ring-icon").textContent=icon;
}
function setFilename(text){
  const el=$("filename");
  const windowEl=$("filename-window");
  el.classList.remove("marquee");
  el.style.removeProperty("--travel");
  el.textContent=text;
  requestAnimationFrame(()=>{
    const travel=Math.max(0,el.scrollWidth-windowEl.clientWidth+8);
    if(travel>3){
      el.style.setProperty("--travel",`${-travel}px`);
      el.classList.add("marquee");
    }
  });
}
function compactCandidates(){
  const live=downloadingTasks();
  if(live.length)return live;
  if(Date.now()<completionUntil)return downloadedTasks().slice(0,1);
  return [];
}
function ringState(task){
  if(!task)return{pct:0,color:"rgba(255,255,255,.18)",icon:"•",action:"expand"};
  if(COMPLETE.has(task.status))return{pct:1,color:"#45d86f",icon:"✓",action:"open"};
  if(PAUSED.has(task.status))return{pct:progress(task)/100,color:"#f4c04e",icon:"▶",action:"resume"};
  if(QUEUED.has(task.status))return{pct:0,color:"rgba(255,255,255,.18)",icon:"▶",action:"resume"};
  return{pct:progress(task)/100,color:"#9b2cff",icon:"Ⅱ",action:"pause"};
}
function render(){
  updateSessionTasks();
  const widget=$("widget");
  widget.classList.toggle("expanded",expanded);
  widget.classList.toggle("offline",!snapshot.online);
  $("expand-icon").textContent=expanded?"⌄":"⌃";

  let newlyComplete=false;
  for(const task of snapshot.downloads){
    const previous=lastStatuses.get(task.id);
    if(sessionTaskIds.has(task.id)&&task.status==="completed"&&previous&&previous!=="completed")newlyComplete=true;
    lastStatuses.set(task.id,task.status);
  }
  if(newlyComplete)completionUntil=Date.now()+5000;

  const candidates=compactCandidates();
  if(compactIndex>=candidates.length)compactIndex=0;
  compactTask=candidates[compactIndex]||null;
  $("cycle-button").classList.toggle("visible",candidates.length>1);

  if(!snapshot.online){
    compactTask=null;setFilename("Lumi server recovering");$("compact-speed").textContent="Reconnecting";$("compact-percent").textContent="";setRing(0,"rgba(255,255,255,.12)","!");
  }else if(compactTask){
    setFilename(taskName(compactTask));
    $("compact-speed").textContent=COMPLETE.has(compactTask.status)?"Completed":fmtRate(compactTask.speed_bytes_per_sec||0);
    $("compact-percent").textContent=COMPLETE.has(compactTask.status)?"":`${Math.round(progress(compactTask))}%`;
    const rs=ringState(compactTask);setRing(rs.pct,rs.color,rs.icon);
  }else{
    setFilename(`Live ↓ ${fmtMbpsFromBytes(snapshot.net?.rx_bps||0)}`);
    $("compact-speed").textContent=capacityLine();
    $("compact-percent").textContent="";
    setRing(0,"rgba(255,255,255,.18)","•");
  }

  const downloading=downloadingTasks(),downloaded=downloadedTasks(),queued=queuedTasks();
  $("count-downloading").textContent=downloading.length;
  $("count-downloaded").textContent=downloaded.length;
  $("count-queued").textContent=queued.length;
  document.querySelectorAll(".tab").forEach(button=>button.classList.toggle("active",button.dataset.tab===selectedTab));
  renderTasks(tabTasks(selectedTab));
  $("footer-summary").innerHTML=`<b>${downloading.length}</b> active · <b>${downloaded.length}</b> downloaded · <b>${queued.length}</b> queued`;
}
function fileGlyph(task){
  const name=String(taskName(task)).toLowerCase();
  if(name.endsWith(".iso"))return"▣";
  if(/\.(zip|rar|7z|tar|gz)$/.test(name))return"▤";
  if(/\.(exe|msi|dmg|pkg|apk)$/.test(name))return"◆";
  return"↓";
}
function taskRow(task){
  const pct=Math.round(progress(task));
  const complete=COMPLETE.has(task.status);
  const paused=PAUSED.has(task.status);
  const queued=QUEUED.has(task.status);
  const icon=complete?"✓":paused||queued?"▶":"Ⅱ";
  const ringColor=complete?"#45d86f":paused?"#f4c04e":"#9b2cff";
  const action=complete?"open":paused||queued?"resume":"pause";
  const meta=complete?`${fmtBytes(task.total_bytes||task.downloaded_bytes||0)} · Completed`:queued?`${fmtBytes(task.total_bytes||0)} · Queued`:`${fmtRate(task.speed_bytes_per_sec||0)} · ${fmtBytes(task.downloaded_bytes||0)} / ${fmtBytes(task.total_bytes||0)}`;
  return `<article class="task">
    <div class="file-badge">${fileGlyph(task)}</div>
    <div class="task-copy"><div class="task-name" title="${escapeHtml(taskName(task))}">${escapeHtml(taskName(task))}</div><div class="task-meta">${escapeHtml(meta)}</div></div>
    <div class="task-percent">${complete?"":`${pct}%`}</div>
    <button class="task-ring" style="--p:${complete?100:pct};--ring:${ringColor}" data-action="${action}" data-id="${escapeHtml(task.id)}" title="${complete?"Open file location":paused||queued?"Resume":"Pause"}"><span>${icon}</span></button>
    <button class="more" data-action="${complete?"open":"cancel"}" data-id="${escapeHtml(task.id)}" title="${complete?"Open location":"Cancel"}">${complete?"↗":"⋮"}</button>
  </article>`;
}
function renderTasks(tasks){
  const list=$("task-list");
  if(!tasks.length){list.innerHTML=`<div class="empty">No ${escapeHtml(selectedTab)} downloads.<br>${escapeHtml(capacityLine())}</div>`;return}
  list.innerHTML=tasks.slice(0,12).map(taskRow).join("");
}
async function refresh(){snapshot=await window.lumiWidget.snapshot();expanded=Boolean(snapshot.expanded);render()}
async function toggle(){expanded=await window.lumiWidget.toggleExpanded();render()}
async function runAction(action,id=""){await window.lumiWidget.action(action,id);await refresh()}

$("summary").onclick=toggle;
$("logo-button").onclick=toggle;
$("expand-button").onclick=toggle;
$("footer-main").onclick=()=>window.lumiWidget.action("main");
$("cycle-button").onclick=()=>{const candidates=compactCandidates();if(candidates.length){compactIndex=(compactIndex+1)%candidates.length;render()}};
$("ring-button").onclick=async()=>{const state=ringState(compactTask);if(state.action==="expand")return toggle();await runAction(state.action,compactTask.id)};
$("tabs").onclick=event=>{const button=event.target.closest("[data-tab]");if(!button)return;selectedTab=button.dataset.tab;render()};
$("task-list").onclick=async event=>{const button=event.target.closest("[data-action]");if(!button)return;await runAction(button.dataset.action,button.dataset.id||"")};

window.lumiWidget.onExpanded(value=>{expanded=value;render()});
window.lumiWidget.onSettings(()=>refresh());
window.lumiWidget.onCapacity(value=>{snapshot.capacity=value;render()});
refresh();
setInterval(refresh,1300);
</script>
</body>
</html>
