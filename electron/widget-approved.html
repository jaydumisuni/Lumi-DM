<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumi download widget</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f8f9ff}button{font:inherit;color:inherit}.widget{position:absolute;inset:5px 0 0;border:1px solid rgba(194,126,255,.58);border-radius:16px;background:linear-gradient(145deg,rgba(20,14,37,.96),rgba(6,12,24,.96));box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden;-webkit-app-region:drag}.widget::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 20%,rgba(142,55,255,.22),transparent 45%),radial-gradient(circle at 88% 78%,rgba(0,174,255,.16),transparent 42%)}.compact{position:relative;height:60px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 10px}.logo{width:36px;height:36px;padding:0;border:0;background:transparent;object-fit:contain;-webkit-app-region:no-drag;cursor:pointer;filter:drop-shadow(0 0 7px rgba(99,109,255,.55))}.summary{min-width:0}.task-name{font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{margin-top:4px;font-size:10px;color:#adb7ce;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;gap:5px;-webkit-app-region:no-drag}.ring{--p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#9b3cff calc(var(--p)*1%),rgba(255,255,255,.11) 0);position:relative}.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#0a0e1b}.ring b{position:relative;font-size:8px}.action{width:27px;height:27px;border:1px solid rgba(177,105,255,.55);border-radius:50%;background:rgba(31,20,52,.9);cursor:pointer}.action.cancel{border-color:rgba(255,105,120,.5);color:#ff9aa6;background:rgba(88,19,34,.55)}.action:disabled{opacity:.38;cursor:default}.close-widget{position:absolute;z-index:6;left:7px;top:7px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(13,16,28,.8);color:#bdc5d6;cursor:pointer;-webkit-app-region:no-drag;display:none}.widget:hover .close-widget,.widget.expanded .close-widget{display:block}.expand{position:absolute;z-index:7;right:13px;top:0;width:19px;height:10px;border:1px solid rgba(190,116,255,.68);border-bottom:0;border-radius:8px 8px 0 0;background:#241536;-webkit-app-region:no-drag;cursor:pointer}.expanded-panel{display:none;position:relative;height:250px;padding:9px 10px 12px;border-top:1px solid rgba(255,255,255,.08);overflow:hidden}.widget.expanded .expanded-panel{display:block}.task-list{display:grid;gap:7px;max-height:180px;overflow:auto}.task-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.035)}.file-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:rgba(112,63,255,.2);font-size:7px}.row-name{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-meta{font-size:9px;color:#a8b2c8;margin-top:2px}.row-actions{display:flex;gap:2px;-webkit-app-region:no-drag}.row-action{border:0;background:transparent;color:#c78cff;cursor:pointer;padding:3px}.row-action.cancel{color:#ff8f9d}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:9px;color:#9aa5bb}.open-main{border:0;background:transparent;color:#b978ff;cursor:pointer;-webkit-app-region:no-drag}
</style>
</head>
<body>
<button class="expand" id="expand-button" aria-label="Expand widget"></button>
<section class="widget" id="widget">
  <button class="close-widget" id="close-widget" aria-label="Close download widget">×</button>
  <div class="compact">
    <img class="logo" id="logo-button" src="../static/favicon-256.png" alt="Open Lumi">
    <div class="summary"><div class="task-name" id="primary-name">Lumi Download Manager</div><div class="task-meta" id="primary-meta">No active downloads</div></div>
    <div class="controls"><div class="ring" id="progress-ring"><b id="progress-text">0%</b></div><button class="action" id="primary-action" aria-label="Pause or resume">▶</button><button class="action cancel" id="primary-cancel" aria-label="Cancel download">×</button></div>
  </div>
  <div class="expanded-panel"><div class="task-list" id="task-list"></div><div class="footer"><span id="network-status">Lumi ready</span><button class="open-main" id="open-main">Open Lumi</button></div></div>
</section>
<script>
const state={snapshot:null,expanded:false};
const $=selector=>document.querySelector(selector);
const rawStatus=task=>String(task?.status||"").toLowerCase();
const shownStatus=task=>["running","downloading","resolving","verifying","post_processing","pausing"].includes(rawStatus(task))?"downloading":rawStatus(task);
const active=task=>shownStatus(task)==="downloading";
const formatRate=value=>{const bps=Number(value||0);return bps>=1048576?`${(bps/1048576).toFixed(2)} MB/s`:bps>=1024?`${(bps/1024).toFixed(1)} KB/s`:`${Math.round(bps)} B/s`};
function progress(task){const total=Number(task?.total_bytes||0),done=Number(task?.downloaded_bytes||0);return total>0?Math.max(0,Math.min(100,Math.round(done*100/total))):Math.max(0,Math.min(100,Math.round(Number(task?.progress_percent||0))))}
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function taskRow(task){const row=element("div","task-row");row.append(element("div","file-icon","FILE"));const details=element("div");details.append(element("div","row-name",task.filename||"Download"));details.append(element("div","row-meta",`${progress(task)}% · ${formatRate(task.speed_bytes_per_sec)} · ${shownStatus(task)||"queued"}`));row.append(details);const actions=element("div","row-actions");const pause=element("button","row-action",active(task)?"Ⅱ":"▶");pause.dataset.id=String(task.id||"");pause.dataset.action=active(task)?"pause":"resume";pause.setAttribute("aria-label",active(task)?"Pause download":"Resume download");const cancel=element("button","row-action cancel","×");cancel.dataset.id=String(task.id||"");cancel.dataset.action="cancel";cancel.setAttribute("aria-label","Cancel download");actions.append(pause,cancel);row.append(actions);return row}
function render(){const tasks=state.snapshot?.downloads||[];const activeTasks=tasks.filter(active);const primary=activeTasks[0]||tasks.find(task=>rawStatus(task)==="paused")||null;const live=activeTasks.reduce((sum,task)=>sum+Number(task.speed_bytes_per_sec||0),0);$("#primary-name").textContent=primary?.filename||"Lumi Download Manager";$("#primary-meta").textContent=primary?`${shownStatus(primary)==="downloading"?"Downloading":shownStatus(primary)} · ${formatRate(primary.speed_bytes_per_sec)}`:"No active downloads";const pct=primary?progress(primary):0;$("#progress-ring").style.setProperty("--p",pct);$("#progress-text").textContent=`${pct}%`;$("#primary-action").textContent=primary&&active(primary)?"Ⅱ":"▶";$("#primary-action").disabled=!primary;$("#primary-action").dataset.id=String(primary?.id||"");$("#primary-action").dataset.action=primary&&active(primary)?"pause":"resume";$("#primary-cancel").disabled=!primary;$("#primary-cancel").dataset.id=String(primary?.id||"");const capacity=Number(state.snapshot?.net?.capacity_bps||0);$("#network-status").textContent=state.snapshot?.online===false?"Lumi service offline":`Live ${formatRate(live)} · ${capacity>0?`Capacity ${(capacity*8/1e6).toFixed(1)} Mbps`:"Capacity not tested"}`;const list=$("#task-list");list.replaceChildren();if(!tasks.length){list.append(element("div","empty","No downloads yet"));return}list.append(...tasks.slice(0,6).map(taskRow))}
async function refresh(){try{state.snapshot=await window.lumiWidget.snapshot();render()}catch{state.snapshot={online:false,downloads:[],net:{}};render()}}
const bridge=window.lumiWidget;
$("#close-widget").onclick=()=>window.close();
if(!bridge){$("#primary-meta").textContent="Widget bridge unavailable";$("#network-status").textContent="Open Lumi from the tray"}else{
$("#logo-button").onclick=$("#open-main").onclick=()=>bridge.showMain();
$("#expand-button").onclick=async()=>{state.expanded=await bridge.toggleExpanded();$("#widget").classList.toggle("expanded",state.expanded)};
$("#primary-action").onclick=async event=>{const id=event.currentTarget.dataset.id;if(id)await bridge.action(event.currentTarget.dataset.action,id);void refresh()};
$("#primary-cancel").onclick=async event=>{const id=event.currentTarget.dataset.id;if(id&&confirm("Cancel this Lumi download?"))await bridge.action("cancel",id);void refresh()};
$("#task-list").onclick=async event=>{const button=event.target.closest("[data-action]");if(!button)return;if(button.dataset.action==="cancel"&&!confirm("Cancel this Lumi download?"))return;await bridge.action(button.dataset.action,button.dataset.id);void refresh()};
bridge.onExpanded(value=>$("#widget").classList.toggle("expanded",value));bridge.onSettings(()=>void refresh());bridge.onCapacity(()=>void refresh());let timer=null;const schedule=()=>{clearTimeout(timer);timer=setTimeout(async()=>{if(!document.hidden)await refresh();schedule()},700)};document.addEventListener("visibilitychange",()=>{if(!document.hidden)void refresh()});void refresh().finally(schedule)
}
</script>
</body>
</html>
