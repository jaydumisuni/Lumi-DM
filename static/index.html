<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lumi Download Manager</title>
  <link rel="stylesheet" href="/static/lumi-approved-ui.css">
</head>
<body>
  <div class="app-frame" id="app-frame">
    <aside class="sidebar">
      <div class="company-kicker">THETECHGUY TOOL</div>
      <img class="brand-lockup" src="/static/assets/lumi-brand-transparent.png" alt="Lumi Download Manager">
      <nav class="nav-list" id="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon" data-icon="home"></span><span>Overview</span></button>
        <button class="nav-item" data-view="downloads"><span class="nav-icon" data-icon="download"></span><span>All Downloads</span></button>
        <button class="nav-item" data-view="unfinished"><span class="nav-icon" data-icon="clock"></span><span>Unfinished</span></button>
        <button class="nav-item" data-view="finished"><span class="nav-icon" data-icon="check"></span><span>Finished</span></button>
        <button class="nav-item" data-view="queues"><span class="nav-icon" data-icon="queue"></span><span>Queues</span></button>
        <button class="nav-item" data-view="categories"><span class="nav-icon" data-icon="folder"></span><span>Categories</span></button>
        <button class="nav-item" data-view="grabber"><span class="nav-icon" data-icon="link"></span><span>LinkGrabber</span></button>
        <div class="technician-group open" id="technician-group">
          <button class="nav-item technician-toggle" type="button" aria-expanded="true"><span class="nav-icon" data-icon="tools"></span><span>Technician</span><b>⌄</b></button>
          <div class="technician-subnav">
            <button class="nav-item sub" data-view="firmware"><span class="nav-icon" data-icon="phone"></span><span>Mobile Firmware</span></button>
            <button class="nav-item sub" data-view="operating-systems"><span class="nav-icon" data-icon="monitor"></span><span>Operating Systems</span></button>
          </div>
        </div>
      </nav>
      <section class="storage-card">
        <label class="drive-select-wrap"><select id="drive-select"><option>Drive D:</option><option>Drive C:</option><option>Drive E:</option></select></label>
        <div class="storage-body">
          <div><span class="eyebrow">STORAGE LEFT</span><strong id="storage-left">248.6 GB</strong><small>of 512 GB</small></div>
          <div class="storage-ring"><b id="storage-percent">48%</b></div>
        </div>
        <div class="best-speed"><span>Best speed</span><b>6.4 MB/s</b></div>
      </section>
    </aside>

    <section class="workspace">
      <header class="titlebar">
        <label class="global-search"><span>⌕</span><input id="global-search" type="search" placeholder="Search downloads..."></label>
        <button class="title-icon" id="notification-button" aria-label="Notifications" data-icon="bell"></button>
        <div class="gear-wrap">
          <button class="title-icon gear-button" id="gear-button" aria-haspopup="menu" aria-expanded="false" data-icon="gear"></button>
          <div class="gear-menu" id="gear-menu" role="menu" hidden>
            <button role="menuitem" data-control="settings"><span data-icon="gear"></span>Settings</button>
            <button role="menuitem" data-control="speed-test"><span data-icon="speed"></span>Speed Test</button>
            <button role="menuitem" data-control="browser-extension"><span data-icon="extension"></span>Browser extension</button>
            <button role="menuitem" data-control="updates"><span data-icon="refresh"></span>Check for updates</button>
            <button role="menuitem" data-control="help"><span data-icon="help"></span>Help / Report a bug</button>
            <button role="menuitem" data-control="about"><span data-icon="info"></span>About Lumi</button>
          </div>
        </div>
        <span class="title-separator"></span>
        <button class="window-button" data-window-action="minimize" aria-label="Minimize">—</button>
        <button class="window-button" data-window-action="maximize" aria-label="Maximize">□</button>
        <button class="window-button close" data-window-action="close" aria-label="Close">×</button>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </section>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <section class="modal" id="modal" hidden aria-modal="true" role="dialog"></section>
  <aside class="floating-panel" id="floating-panel" hidden></aside>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="/static/lumi-approved-ui.js"></script>
  <script src="/static/lumi-approved-integration.js"></script>
</body>
</html>
