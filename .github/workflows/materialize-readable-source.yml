name: Materialize readable Lumi sources

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-readable-source.yml
      - scripts/materialize.part01
      - scripts/materialize.v2.part02
      - scripts/materialize.v2.part03
      - scripts/materialize.p4.01
      - scripts/materialize.p4.02
      - scripts/materialize.p4.03
      - scripts/materialize.p4.04
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'ui/approved-replica-integration-20260730' || github.ref_name == 'ui/approved-replica-integration-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/approved-replica-integration-20260730
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recover readable production sources
        shell: bash
        run: |
          head -c 2800 scripts/materialize.v2.part03 > /tmp/materialize.part03
          cat scripts/materialize.p4.01 scripts/materialize.p4.02 scripts/materialize.p4.03 scripts/materialize.p4.04 > /tmp/materialize.part04
          wc -c scripts/materialize.part01 scripts/materialize.v2.part02 /tmp/materialize.part03 /tmp/materialize.part04
          sha256sum scripts/materialize.part01 scripts/materialize.v2.part02 /tmp/materialize.part03 /tmp/materialize.part04
          cat scripts/materialize.part01 scripts/materialize.v2.part02 /tmp/materialize.part03 /tmp/materialize.part04 > /tmp/materialize.py.gz.b64
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path("/tmp/materialize.py.gz.b64").read_text(encoding="utf-8")
          print("combined-length", len(encoded), "mod4", len(encoded) % 4)
          Path("/tmp/materialize.py").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/materialize.py .
          rm -f scripts/materialize.py.gz.b64 scripts/materialize.part0{1,2,3,4,5} scripts/materialize.v2.part0{2,3,4} scripts/materialize.p4.0{1,2,3,4} scripts/ping.tmp
      - name: Validate materialized sources
        shell: bash
        run: |
          node --check static/lumi-approved-ui.js
          node --check static/lumi-approved-integration.js
          node --check electron/main.js
          node --check electron/preload-main.js
          node tests/lumi-ui-contract.test.js
          python -m py_compile server.py core/v2/runtime.py tests/test_release_gate_download.py
      - name: Commit readable production source
        shell: bash
        run: |
          git config user.name "THETECHGUY Release Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize readable Lumi production sources"
          git push origin HEAD:ui/approved-replica-integration-20260730
