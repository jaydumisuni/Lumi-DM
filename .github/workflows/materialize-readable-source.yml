name: Materialize readable Lumi sources

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-readable-source.yml
      - scripts/materialize.part01
      - scripts/materialize.v2.part02
      - scripts/materialize.v2.part03
      - scripts/materialize.p4.01
      - scripts/materialize.p4.02
      - scripts/materialize.p4.03
      - scripts/materialize.p4.04
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'ui/approved-replica-integration-20260730' || github.ref_name == 'ui/approved-replica-integration-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/approved-replica-integration-20260730
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recover readable production sources
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/materialize.part01 \
            scripts/materialize.v2.part02 \
            scripts/materialize.v2.part03 \
            scripts/materialize.p4.01 \
            scripts/materialize.p4.02 \
            scripts/materialize.p4.03 \
            scripts/materialize.p4.04 \
            > /tmp/materialize.py.gz.b64
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('/tmp/materialize.py.gz.b64').read_text(encoding='utf-8')
          print('combined-length', len(encoded), 'mod4', len(encoded) % 4)
          Path('/tmp/materialize.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/materialize.py .
          rm -f scripts/materialize* scripts/finalize-readable-* scripts/ping.tmp
      - name: Validate readable production sources
        shell: bash
        run: |
          set -euo pipefail
          node --check electron/main.js
          node --check electron/preload-main.js
          node --check static/lumi-approved-ui.js
          node --check static/lumi-approved-integration.js
          node tests/lumi-ui-contract.test.js
          node tests/lumi-windows-lifecycle.test.js
          python -m py_compile server.py core/v2/runtime.py tests/test_release_gate_download.py
          test ! -e electron/main-payload-01.js
          test ! -e static/lumi-payload-01.js
          test ! -e static/lumi-approved-loader.js
          test ! -e static/lumi-release-gate-hotfix.js
      - name: Commit readable production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THETECHGUY Release Gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Materialize readable Lumi production sources"
          git push origin HEAD:ui/approved-replica-integration-20260730
