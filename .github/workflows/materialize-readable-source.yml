name: Readable Lumi source guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readable-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject opaque runtime transport
        shell: bash
        run: |
          set -euo pipefail
          node --check electron/main.js
          node --check electron/preload-main.js
          node --check electron/release-gate-contract.js
          node --check static/lumi-approved-ui.js
          test -z "$(find electron static -type f -name '*payload*' -print -quit)"
          ! grep -Eq '_compile|gunzipSync' electron/main.js
          ! grep -Eq 'lumi-payload-|lumi-approved-loader' static/index.html
          grep -Fq 'lumi-approved-ui.css' static/index.html
          grep -Fq 'lumi-approved-ui.js' static/index.html
          test -f static/assets/lumi-brand-transparent.png
          test -f static/favicon-256.png
