name: Regenerate Lumi Icons

on:
  push:
    branches:
      - ui/approved-replica-integration-20260730
    paths:
      - "static/assets/lumi-brand-transparent.png"
      - "scripts/generate_lumi_icon_family.py"
      - "scripts/PATCH_MAIN_ATOMIC_SETTINGS.READY"
      - ".github/workflows/regenerate-lumi-icons.yml"
  pull_request:
    branches:
      - main
    paths:
      - "static/assets/lumi-brand-transparent.png"
      - "scripts/generate_lumi_icon_family.py"
      - ".github/workflows/regenerate-lumi-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/approved-replica-integration-20260730
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply pending atomic desktop-settings correction
        shell: bash
        run: |
          if [ -f scripts/PATCH_MAIN_ATOMIC_SETTINGS.READY ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path("electron/main.js")
          text = path.read_text(encoding="utf-8")
          old = '''  ipcMain.handle("v5-desktop-settings-save", (_event, value) => {
            const wasVisible = Boolean(widgetWindow && !widgetWindow.isDestroyed() && widgetWindow.isVisible());
            const requested = value && typeof value === "object" ? value : {};
            if (Object.prototype.hasOwnProperty.call(requested, "startAtLogin")) {
              setStartupEnabled(Boolean(requested.startAtLogin));
            }
            const { startAtLogin: _ignored, ...desktop } = requested;
            const next = writeDesktopPrefs(validateDesktopDirectories(desktop));
          '''
          new = '''  ipcMain.handle("v5-desktop-settings-save", (_event, value) => {
            const wasVisible = Boolean(widgetWindow && !widgetWindow.isDestroyed() && widgetWindow.isVisible());
            const requested = value && typeof value === "object" ? value : {};
            const { startAtLogin: requestedStartup, ...desktop } = requested;
            const validated = validateDesktopDirectories(desktop);
            if (Object.prototype.hasOwnProperty.call(requested, "startAtLogin")) {
              setStartupEnabled(Boolean(requestedStartup));
            }
            const next = writeDesktopPrefs(validated);
          '''
          if old not in text:
              raise SystemExit("Expected desktop settings block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            rm -f scripts/PATCH_MAIN_ATOMIC_SETTINGS.READY
            rm -f .github/workflows/patch-main-atomic-settings.yml
            node --check electron/main.js
          fi
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Remove stale icons and generate the complete family
        run: python scripts/generate_lumi_icon_family.py
      - name: Verify one approved identity across app extension and installer
        shell: bash
        run: |
          test -f assets/windows/Lumi-DM.ico
          test -f static/favicon-256.png
          test -f browser-extension/icons/icon128.png
          test -f build_config/lumi-icon-family.json
          test ! -e Resouces/my_logo.png
          grep -q 'static/assets/lumi-brand-transparent.png' build_config/lumi-icon-family.json
          ! git ls-files | grep -E '(^|/)(lumi-logo|TechGuyTool-DM|legacy.*icon|old.*icon|my_logo)\.(ico|icns|png)$'
      - name: Commit generated identity and pending source corrections
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Lumi identity and pending source corrections already match"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply atomic settings and regenerate approved Lumi identity"
          git push origin HEAD:ui/approved-replica-integration-20260730
