name: Lumi Issue 8 Playwright Proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-and-extension-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      LUMI_PLAYWRIGHT_BASE: http://127.0.0.1:7000
      LUMI_PLAYWRIGHT_ARTIFACTS: artifacts
      LUMIDM_DESKTOP_SECRET: playwright-desktop-secret
      LUMIDM_RUNTIME_INSTANCE: playwright-runtime-instance
      LUMIDM_DATA_DIR: ${{ runner.temp }}/lumi-playwright-data
      LUMIDM_DOWNLOAD_DIR: ${{ runner.temp }}/lumi-playwright-downloads
      LUMIDM_TEMP_DIR: ${{ runner.temp }}/lumi-playwright-temporary
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Runtime and Playwright proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps --no-shell chromium

      - name: Start isolated Lumi source Runtime
        run: |
          set -eu
          mkdir -p artifacts "$LUMIDM_DATA_DIR" "$LUMIDM_DOWNLOAD_DIR" "$LUMIDM_TEMP_DIR"
          python server.py --host 127.0.0.1 --port 7000 > artifacts/playwright-runtime.log 2>&1 &
          echo $! > artifacts/playwright-runtime.pid
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:7000/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat artifacts/playwright-runtime.log
          exit 1

      - name: Prove compact main renderer and interactions
        run: node tests/playwright_main_correction.js

      - name: Prove real MV3 extension bridge and media handoff
        run: node tests/playwright_extension_correction.js

      - name: Stop isolated Runtime
        if: always()
        run: |
          if [ -f artifacts/playwright-runtime.pid ]; then
            kill -INT "$(cat artifacts/playwright-runtime.pid)" 2>/dev/null || true
            sleep 1
          fi

      - name: Upload correction proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-issue8-playwright-${{ github.event.pull_request.head.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
