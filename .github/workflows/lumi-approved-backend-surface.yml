name: Lumi approved backend surface

on:
  push:
    branches: [ui/approved-replica-integration-20260730]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-backend-surface:
    name: Approved screen backend behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Lumi runtime and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Categories queues LinkGrabber settings and overview backends
        run: pytest -q -s tests/test_approved_backend_surface.py -vv
