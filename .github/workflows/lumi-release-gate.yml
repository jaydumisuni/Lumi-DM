name: Lumi release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-approved-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize exact owner-approved renderer when staged
        run: python scripts/materialize-exact-approved-ui.py
      - name: Commit literal approved replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static scripts/exact-approved-ui
          if git diff --cached --quiet; then
            echo "No materialization changes required"
            exit 0
          fi
          git commit -m "Replace Lumi renderer with exact approved UI bytes"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

  ui-electron-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check static/lumi-approved-ui.js
          node --check static/lumi-approved-integration.js
          node --check static/lumi-release-gate-hotfix.js
          node --check electron/main.js
          node --check electron/preload-main.js
          node --check electron/release-gate-contract.js
          node --check static/browser-extension/chromium/background.js
          node --check static/browser-extension/chromium/popup.js
      - name: UI settings speed-test extension and security contracts
        run: |
          node tests/lumi-ui-contract.test.js
          node tests/security-contract.test.js

  approved-visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install visual comparison dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy "Pillow>=9.1.0" playwright
          python -m playwright install --with-deps chromium
      - name: Compare fifteen screens with approved mockups
        run: python tests/visual_approved_gate.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-approved-visual-evidence
          path: artifacts/visual
          if-no-files-found: error

  windows-lifecycle-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Windows tray widget taskbar startup and identity contract
        run: node tests/lumi-windows-lifecycle.test.js

  real-download-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Real segmented download integrity persistence and resume proof
        run: pytest -q -s tests/test_release_gate_download.py tests/test_settings_restart.py -vv

  windows-public-internet-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Lumi runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download public Cloudflare payload through Lumi with 32 connections
        run: python tests/windows_public_internet_smoke.py

  sergeant-20-for-2:
    name: Sergeant 20-for-2
    if: always()
    needs:
      - ui-electron-contract
      - approved-visual-contract
      - windows-lifecycle-contract
      - real-download-engine
      - windows-public-internet-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require every independent evidence lane
        env:
          UI_RESULT: ${{ needs.ui-electron-contract.result }}
          VISUAL_RESULT: ${{ needs.approved-visual-contract.result }}
          WINDOWS_RESULT: ${{ needs.windows-lifecycle-contract.result }}
          ENGINE_RESULT: ${{ needs.real-download-engine.result }}
          INTERNET_RESULT: ${{ needs.windows-public-internet-smoke.result }}
        run: |
          test "$UI_RESULT" = success
          test "$VISUAL_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$ENGINE_RESULT" = success
          test "$INTERNET_RESULT" = success
      - name: Execute both twenty-lane Sergeant passes
        run: node tests/sergeant-20-for-2.test.js
