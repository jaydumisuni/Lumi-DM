name: Repair Lumi identity binaries

on:
  push:
    branches:
      - fix/lumi-identity-binaries
    paths:
      - tools/generate_lumi_identity.py
      - tests/test_lumi_brand_theme_lock.py
      - .github/workflows/repair-lumi-identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/lumi-identity-binaries
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proof tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'pytest==8.4.1'

      - name: Generate and verify every Lumi identity asset
        run: python tools/generate_lumi_identity.py --write --verify

      - name: Prove identity and theme lock
        run: python -m pytest tests/test_lumi_brand_theme_lock.py -q

      - name: Commit generated binaries
        shell: bash
        run: |
          set -euo pipefail
          git add assets/branding-manifest.json assets/windows/Lumi-DM.ico \
            browser-extension/icons \
            android/app/src/main/res/mipmap-*/ic_launcher.png \
            ios/AppIcon.appiconset \
            macos/icons.iconset \
            static/favicon-*.png \
            static/browser-extension/chromium/icon.svg
          if git diff --cached --quiet; then
            echo 'Generated identity assets already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate all Lumi identity binaries from approved logo'
          git push origin HEAD:fix/lumi-identity-binaries
