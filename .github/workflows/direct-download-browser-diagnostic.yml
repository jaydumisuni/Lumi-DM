name: Direct Download Browser Diagnostic

on:
  push:
    branches: [diagnostic/direct-finalization-3db]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Diagnose direct download finalization
        run: python -m pytest -q tests/test_direct_download_browser_diagnostic.py -s
