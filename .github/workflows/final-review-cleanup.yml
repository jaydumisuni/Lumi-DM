name: Apply Lumi final review cleanup

on:
  push:
    branches:
      - ui/approved-replica-integration-20260730
    paths:
      - scripts/FINAL_REVIEW_CLEANUP.READY

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply the final review corrections
        run: |
          python scripts/final_review_cleanup.py
          python -m py_compile tests/test_release_gate_download.py tests/test_settings_restart.py
          node --check electron/preload-widget.js
          node --check static/lumi-runtime-controls.js
          node --check tests/sergeant-20-for-2.test.js
          node tests/security-contract.test.js
          node tests/lumi-windows-lifecycle.test.js
          node tests/sergeant-owner-findings.test.js
          rm scripts/FINAL_REVIEW_CLEANUP.READY
          rm scripts/final_review_cleanup.py
          rm .github/workflows/final-review-cleanup.yml
      - name: Commit the verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clear final Lumi review findings"
          git push origin HEAD:ui/approved-replica-integration-20260730
