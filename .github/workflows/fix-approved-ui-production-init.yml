name: Fix approved UI production initialization

on:
  push:
    branches:
      - ui/approved-replica-integration-20260730
    paths:
      - scripts/fix-approved-ui-production-init.READY

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct production initialization without changing visual markup or CSS
        run: |
          python scripts/fix-approved-ui-production-init.py
          node --check static/lumi-approved-ui.js
          rm scripts/fix-approved-ui-production-init.READY
      - name: Commit corrected approved renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/lumi-approved-ui.js scripts/fix-approved-ui-production-init.READY
          git commit -m "Fix approved renderer production initialization order"
          git push origin HEAD:ui/approved-replica-integration-20260730
