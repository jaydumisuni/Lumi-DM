name: Lumi Stage 0 Sergeant Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  sergeant-stage0-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete Lumi history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sergeant
        run: python -m pip install --disable-pip-version-check -q sergeant-reviewer==0.4.0

      - name: Diagnose packaged Sergeant assurance detector
        run: |
          python - <<'PY'
          from importlib import metadata
          from pathlib import Path

          distribution = metadata.distribution('sergeant-reviewer')
          print('SERGEANT_PACKAGE_VERSION', distribution.version)
          roots = set()
          for item in distribution.files or ():
              path = Path(distribution.locate_file(item))
              if path.suffix != '.py' or not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  continue
              lower = content.lower()
              if 'explicit assurance document' not in lower and 'assurance document' not in lower:
                  continue
              roots.add(str(path))
              print('SERGEANT_ASSURANCE_SOURCE', path)
              lines = content.splitlines()
              for index, line in enumerate(lines):
                  if 'assurance' not in line.lower():
                      continue
                  start = max(0, index - 8)
                  end = min(len(lines), index + 18)
                  print(f'--- lines {start + 1}-{end} ---')
                  for number in range(start, end):
                      print(f'{number + 1}: {lines[number]}')
          if not roots:
              raise SystemExit('Packaged Sergeant assurance detector source was not found')
          PY

      - name: Build exact PR changed-file list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .sergeant-stage0-files.txt
          test -s .sergeant-stage0-files.txt
          cat .sergeant-stage0-files.txt

      - name: Sergeant primary Stage 0 review
        env:
          SERGEANT_CPL_POLICY: disabled
        run: |
          sergeant pr-review . --file-list .sergeant-stage0-files.txt --pretty > .sergeant-stage0-review.json
          cat .sergeant-stage0-review.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('.sergeant-stage0-review.json').read_text(encoding='utf-8'))
          verdict = str(payload.get('verdict', {}).get('verdict', '')).upper()
          if verdict != 'APPROVE':
              required = payload.get('verdict', {}).get('required_actions', [])
              raise SystemExit(f'Sergeant Stage 0 verdict is {verdict or "UNKNOWN"}: {required}')
          print('Sergeant Stage 0 verdict APPROVE')
          PY
