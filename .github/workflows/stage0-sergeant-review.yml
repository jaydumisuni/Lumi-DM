name: Lumi Stage 0 Sergeant Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  sergeant-stage0-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete Lumi history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sergeant
        run: python -m pip install --disable-pip-version-check -q sergeant-reviewer==0.4.0

      - name: Build exact PR changed-file list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .sergeant-stage0-files.txt
          test -s .sergeant-stage0-files.txt
          cat .sergeant-stage0-files.txt

      - name: Sergeant primary Stage 0 review
        env:
          SERGEANT_CPL_POLICY: disabled
        run: |
          sergeant pr-review . --file-list .sergeant-stage0-files.txt --pretty > .sergeant-stage0-review.json
          cat .sergeant-stage0-review.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('.sergeant-stage0-review.json').read_text(encoding='utf-8'))
          verdict = str(payload.get('verdict', {}).get('verdict', '')).upper()
          if verdict != 'APPROVE':
              required = payload.get('verdict', {}).get('required_actions', [])
              raise SystemExit(f'Sergeant Stage 0 verdict is {verdict or "UNKNOWN"}: {required}')
          print('Sergeant Stage 0 verdict APPROVE')
          PY
