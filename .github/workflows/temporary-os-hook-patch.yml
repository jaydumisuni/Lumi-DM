name: Temporary Interaction Quality Patch

on:
  push:
    branches: [fix/full-desktop-interaction-contract]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-desktop-interaction-contract
      - name: Fix audit submit detection and form patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path("static/interaction-contract.js")
          text = contract.read_text(encoding="utf-8")
          old = '    if (button.type === "submit" || button.getAttribute("type") === "submit") return Boolean(button.closest("form"));'
          new = '    if (button.closest("form") && (button.type === "submit" || button.getAttribute("role") === "submit")) return true;'
          if new not in text:
              if old not in text:
                  raise SystemExit("Expected audit submit detection line not found")
              text = text.replace(old, new, 1)
              contract.write_text(text, encoding="utf-8")
              print("Fixed interaction audit submit detection")

          index = Path("static/index.html")
          html = index.read_text(encoding="utf-8")
          invalid = 'pattern="[a-zA-Z0-9_-]+"'
          valid = 'pattern="[a-zA-Z0-9_\\-]+"'
          if invalid in html:
              count = html.count(invalid)
              html = html.replace(invalid, valid)
              index.write_text(html, encoding="utf-8")
              print(f"Fixed {count} HTML pattern attributes")
          elif valid not in html:
              raise SystemExit("Expected Queue/Category pattern attributes not found")
          PY

          if git diff --quiet -- static/interaction-contract.js static/index.html; then
            echo "No quality patch commit required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/interaction-contract.js static/index.html
          git commit -m "fix: make interaction audit and form validation browser-correct"
          git push origin HEAD:fix/full-desktop-interaction-contract
