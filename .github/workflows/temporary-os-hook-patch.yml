name: Temporary OS Hook Patch

on:
  push:
    branches:
      - fix/full-desktop-interaction-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-desktop-interaction-contract
      - name: Apply exact delegated listener patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("static/operating-systems.js")
          text = path.read_text(encoding="utf-8")
          old = '''    document.querySelector('[data-view="operating_systems"]')?.addEventListener("click", () => {
              setTimeout(() => void renderOsView(), 0);
            });'''
          new = '''    document.addEventListener("click", event => {
              if (!event.target.closest?.('.nav-item[data-view="operating_systems"]')) return;
              setTimeout(() => void renderOsView(), 0);
            });'''

          if new in text:
              print("Delegated OS listener already present")
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Applied delegated OS listener")
          else:
              raise SystemExit("Expected OS navigation listener was not found; refusing to patch")
          PY

          if git diff --quiet -- static/operating-systems.js; then
            echo "No patch commit required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/operating-systems.js
          git commit -m "fix: delegate operating systems navigation rendering"
          git push origin HEAD:fix/full-desktop-interaction-contract
