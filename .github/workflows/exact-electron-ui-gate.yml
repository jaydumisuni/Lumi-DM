name: Exact approved Electron UI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove exact approved repository bytes and production hooks
        run: |
          node --check static/lumi-approved-ui.js
          node --check electron/main.js
          node --check electron/preload-main.js
          node tests/lumi-ui-contract.test.js

  approved-browser-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install visual dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy "Pillow>=9.1.0" playwright
          python -m playwright install --with-deps chromium
      - name: Render exact frozen files against approved references
        run: python tests/visual_approved_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-approved-browser-reference
          path: artifacts/visual
          if-no-files-found: error

  canonical-icon-pixels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependency
        run: pip install "Pillow>=9.1.0"
      - name: Inspect canonical taskbar tray window and installer assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          required = [16, 24, 32, 48, 64, 96, 128, 256]
          for size in required:
              path = Path('static') / f'favicon-{size}.png'
              image = Image.open(path).convert('RGBA')
              assert image.size == (size, size), (path, image.size)
              bbox = image.getchannel('A').getbbox()
              assert bbox is not None, path
              if size == 256:
                  assert bbox[2] <= 238, bbox
                  pixels = image.load()
                  assert not any(pixels[x, y][3] > 8 for x in range(239, 256) for y in range(256))
          ico = Image.open('assets/windows/Lumi-DM.ico')
          assert ico.format == 'ICO'
          main = Path('electron/main.js').read_text(encoding='utf-8')
          assert main.count('favicon-256.png') >= 1
          contract = Path('techguy-build.json').read_text(encoding='utf-8')
          assert 'static/favicon-256.png' in contract
          PY

  actual-windows-electron:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Lumi and Electron capture dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "Pillow>=9.1.0"
          npm install --no-save electron@29 playwright@1.54.2
      - name: Launch electron/main.js and capture all fifteen real BrowserWindow states
        shell: pwsh
        env:
          LUMIDM_PYTHON: python
        run: node tests/electron_visual_gate.mjs
      - name: Compare actual Electron captures with the approved references
        run: python tests/compare_electron_visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-windows-electron-approved-ui
          path: artifacts/electron-visual
          if-no-files-found: error

  exact-approved-electron-ui:
    name: Exact approved Electron UI
    if: always()
    needs: [exact-source, approved-browser-reference, canonical-icon-pixels, actual-windows-electron]
    runs-on: ubuntu-latest
    steps:
      - name: Require source browser icon and actual Electron proof
        env:
          SOURCE: ${{ needs.exact-source.result }}
          BROWSER: ${{ needs.approved-browser-reference.result }}
          ICON: ${{ needs.canonical-icon-pixels.result }}
          ELECTRON: ${{ needs.actual-windows-electron.result }}
        run: |
          test "$SOURCE" = success
          test "$BROWSER" = success
          test "$ICON" = success
          test "$ELECTRON" = success
