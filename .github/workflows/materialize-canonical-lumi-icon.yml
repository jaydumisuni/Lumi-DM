name: Materialize canonical Lumi icon

on:
  push:
    branches:
      - ui/approved-replica-integration-20260730
    paths:
      - scripts/canonical-lumi-icon.READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependency
        run: python -m pip install "Pillow>=9.1.0"
      - name: Generate canonical icon family
        run: python scripts/materialize-canonical-lumi-icon.py
      - name: Verify the canonical mark and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          required = [16, 24, 32, 48, 64, 96, 128, 256]
          for size in required:
              path = Path('static') / f'favicon-{size}.png'
              image = Image.open(path).convert('RGBA')
              assert image.size == (size, size), (path, image.size)
              assert image.getchannel('A').getbbox() is not None, path
          ico = Image.open('assets/windows/Lumi-DM.ico')
          assert ico.format == 'ICO'
          assert Path('static/favicon-256.png').read_bytes().find(b'\x00' * 256) == -1
          PY
          rm scripts/canonical-lumi-icon.READY
      - name: Commit canonical icon assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static/favicon-*.png assets/windows/Lumi-DM.ico scripts/canonical-lumi-icon.READY
          git commit -m "Materialize canonical Lumi icon family"
          git push origin HEAD:ui/approved-replica-integration-20260730
