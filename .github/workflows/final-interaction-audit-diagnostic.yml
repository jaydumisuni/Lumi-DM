name: Lumi Final Interaction Audit Diagnostic

on:
  push:
    branches:
      - fix/full-desktop-interaction-contract
  pull_request:

permissions:
  contents: read

jobs:
  final-audit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Instrument final audit output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_desktop_browser_e2e_v4.py')
          text = path.read_text(encoding='utf-8')
          needle = '''            print("FINAL_INTERACTION_AUDIT=", final_audit)\n            if http_failures:\n'''
          replacement = '''            print("FINAL_INTERACTION_AUDIT=", final_audit)\n            if final_audit != "ready":\n                failures = page.evaluate("() => window.LumiInteractionAudit?.failures || []")\n                print("FINAL_INTERACTION_FAILURES=", failures)\n                print_visible_buttons(page)\n            if http_failures:\n'''
          if needle not in text:
              raise SystemExit('final audit insertion point not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Full desktop browser interaction diagnostic
        run: |
          python -m pytest -q tests/test_desktop_browser_e2e_v4.py -s
