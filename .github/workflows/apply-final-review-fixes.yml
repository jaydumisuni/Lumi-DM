name: Apply final Lumi review fixes

on:
  push:
    branches: [ui/approved-replica-integration-20260730]
    paths:
      - scripts/apply_final_review_fixes.py
      - .github/workflows/apply-final-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/approved-replica-integration-20260730
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final readable-source corrections
        run: python scripts/apply_final_review_fixes.py
      - name: Validate corrected source
        run: |
          node --check electron/main.js
          node --check electron/preload-main.js
          node --check electron/release-gate-contract.js
          node --check static/lumi-approved-ui.js
          node --check static/lumi-approved-integration.js
          node --check static/lumi-release-gate-hotfix.js
          node tests/lumi-ui-contract.test.js
          node tests/security-contract.test.js
          node tests/lumi-windows-lifecycle.test.js
          node tests/sergeant-20-for-2.test.js
          python -m py_compile tests/windows_public_internet_smoke.py tests/test_release_gate_download.py tests/test_settings_restart.py tests/visual_approved_gate.py
      - name: Commit final corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Resolve final CodeRabbit release findings"
          git push origin HEAD:ui/approved-replica-integration-20260730
