<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumi DM</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:380px;min-height:240px;background:#0d1015;color:#eef2f7;font:13px Inter,system-ui,sans-serif}button,input{font:inherit}.header,.connection,.dl-header,.speed-bar,.intercept-row,.tabs-row{display:flex;align-items:center}.header{justify-content:space-between;padding:13px 15px;border-bottom:1px solid #252b35}.brand{display:flex;gap:9px;align-items:center;font-weight:750}.logo{width:28px;height:28px;object-fit:contain}.link-btn,.clear-link{border:0;background:none;color:#66a8ff;cursor:pointer}.url-row{display:flex;gap:7px;padding:12px 15px 7px}.url-input{min-width:0;flex:1;border:1px solid #2a313d;background:#161b23;color:#eef2f7;border-radius:8px;padding:8px 10px;outline:none}.url-input:focus{border-color:#4f9ef8}.primary,.type-btn,.tabs-btn{border:1px solid transparent;border-radius:8px;padding:7px 11px;cursor:pointer}.primary{background:#4f9ef8;color:white;font-weight:700}.type-row{display:flex;gap:6px;padding:0 15px 10px}.type-btn{background:#171d26;border-color:#2a313d;color:#9ba6b5}.type-btn.is-active{color:#72b3ff;border-color:#315f93;background:#17283d}.status-msg{padding:0 15px 8px;min-height:18px;font-size:11px;color:#98a3b3}.connection{justify-content:space-between;margin:0 12px 10px;padding:9px 11px;border:1px solid #2a313d;border-radius:10px;background:#121720}.connection strong{font-size:12px}.connection small{display:block;margin-top:2px;color:#8895a7}.connection-badge{font-size:10px;padding:4px 8px;border-radius:99px;color:#ffce6a;background:#3b2d11}.connection-badge.on{color:#78d9ae;background:#153326}.connection-badge.warn{color:#ff9b9b;background:#3a1818}.dl-section{border-top:1px solid #252b35}.dl-header{justify-content:space-between;padding:9px 15px 6px}.dl-title{font-size:11px;color:#98a3b3;text-transform:uppercase;font-weight:700}.dl-list{max-height:230px;overflow:auto;padding:0 10px 8px}.dl-item{display:flex;gap:7px;align-items:center;padding:7px 5px;border-bottom:1px solid #202631}.dl-dot{width:7px;height:7px;border-radius:50%;background:#596273}.dl-dot.running,.dl-dot.resolving,.dl-dot.downloading{background:#4f9ef8}.dl-dot.completed{background:#5ed19d}.dl-dot.failed,.dl-dot.cancelled{background:#f87171}.dl-dot.paused,.dl-dot.browser_pending{background:#fbbf24}.dl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl-pct{font-size:10px;color:#98a3b3}.empty-msg{padding:16px;text-align:center;color:#98a3b3}.tabs-row,.intercept-row,.speed-bar{padding:9px 15px;border-top:1px solid #252b35;gap:8px}.tabs-btn{background:#14253a;border-color:#2b5a8c;color:#72b3ff;font-size:11px}.tabs-info{flex:1;font-size:11px;color:#98a3b3}.intercept-row{justify-content:space-between}.hint{font-size:10px;color:#818c9b}.toggle{position:relative;width:38px;height:21px}.toggle input{display:none}.slider{position:absolute;inset:0;border-radius:20px;background:#2b3340;cursor:pointer}.slider:before{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;border-radius:50%;background:white;transition:.15s}.toggle input:checked+.slider{background:#4f9ef8}.toggle input:checked+.slider:before{transform:translateX(17px)}.speed-bar{color:#72b3ff;font-weight:700}.speed-dot{width:7px;height:7px;border-radius:50%;background:#36404d}.speed-dot.active{background:#5ed19d}.speed-sub{margin-left:auto;color:#818c9b;font-size:10px;font-weight:400}.sep{color:#46505f}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#333c49;border-radius:5px}
</style>
</head>
<body>
<div class="header"><div class="brand"><img src="icons/icon48.png" class="logo" alt="Lumi">Lumi DM</div><button class="link-btn" id="open-ui">Open Lumi →</button></div>
<div class="url-row"><input class="url-input" id="url-input" placeholder="Paste URL, magnet, or video link…"><button class="primary" id="go-btn">Go</button></div>
<div class="type-row"><button class="type-btn is-active" data-type="auto">Auto</button><button class="type-btn" data-type="video">Video</button><button class="type-btn" data-type="torrent">Torrent</button></div>
<div class="status-msg" id="status-msg"></div>
<div class="connection"><div><strong>Same-PC connection</strong><small>No pairing code required for this browser.</small></div><span class="connection-badge" id="connection-badge">Connecting…</span></div>
<section class="dl-section"><div class="dl-header"><span class="dl-title">Recent Lumi downloads</span><button class="clear-link" id="clear-btn">Clear done</button></div><div class="dl-list" id="dl-list"><div class="empty-msg">Connecting…</div></div></section>
<div class="tabs-row"><button class="tabs-btn" id="all-tabs-btn">⚡ From all open tabs</button><div id="tabs-status" class="tabs-info"></div></div>
<div class="intercept-row"><div><div style="font-weight:700">Send browser downloads to Lumi</div><div class="hint">Lumi remains the single source of truth and asks where to save.</div></div><label class="toggle"><input type="checkbox" id="intercept-toggle" checked><span class="slider"></span></label></div>
<div class="speed-bar"><span class="speed-dot" id="speed-dot"></span><span id="speed-label">Live 0 B/s</span><span class="sep">·</span><span id="inet-label">Capacity not tested</span><span class="speed-sub" id="speed-sub">No active downloads</span></div>
<script src="popup-security.js"></script>
<script src="popup.js"></script>
<script src="popup-native-handoff.js"></script>
<script src="popup-runtime-fix.js"></script>
</body>
</html>
